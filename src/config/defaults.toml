# comply — default configuration.
#
# This file is the single source of truth for every built-in threshold.
# It is embedded in the binary at compile time and merged underneath
# the project's `comply.toml`. Override any knob by declaring the same
# `[rules.<id>] <key> = <value>` entry in your own `comply.toml`.
#
# `comply config print` writes this exact file back to stdout, so
# `comply config init > comply.toml` seeds a project with the same
# defaults, comments included.

# ---------------------------------------------------------------
# Additional import-graph roots for dead-export / unused-file.
#
# By default comply roots reachability at the frontend / route-tree
# entry only. Add server entries, CLI mains, or worker files here so
# backend dead exports are also detected.
#
# entrypoints = ["src/api/server.ts", "src/workers/*.ts"]
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# File / function size limits.
# ---------------------------------------------------------------

[rules.max-file-lines]
max = 200

[rules.no-large-snapshots]
max_lines = 50

[rules.max-function-lines]
max = 30

# ---------------------------------------------------------------
# Readability heuristics.
# ---------------------------------------------------------------

[rules.no-multi-op-oneliner]
min_ops = 6
min_line_length = 80

[rules.prefer-switch-over-chained-if]
min_arms = 4

[rules.prefer-early-return]
# Minimum statements in the wrapped `if` before suggesting a guard clause: a
# short positive `if` reads as the function's intent, so inverting it into a
# negated early return only pays off once the wrapped body is substantial.
min_statements = 3

# A local one-expression function called from exactly one place.
# `max_body_tokens` is the widest body still worth pasting at the call site,
# counted as identifier runs, literals and punctuation characters: past that
# width the call site reads better with the name than with the expression.
# `ignore_names` holds globs for names that earn their own line whatever their
# body — a domain predicate the team wants stated once, for instance.
[rules.no-single-use-one-liner]
max_body_tokens = 30
ignore_names = []

# ---------------------------------------------------------------
# Rust-specific thresholds.
# ---------------------------------------------------------------

[rules.rust-no-large-tuple-return]
max_elements = 3

# rust-no-provider-in-domain keeps vendor names out of the domain layer.
#
# `providers` are the vendor names a domain declaration must not carry. A match
# is on whole word segments of the declared identifier (`_`, `-` and camelCase
# boundaries), so `stripe_customer_id` and `StripeCustomerId` match `stripe`
# while `striped_rows` does not. Add your own vendors here. `meta` is
# deliberately absent: `metadata`/`meta_key` are ordinary domain words.
#
# `domain_globs` scopes the rule to the domain tree — an adapter is exactly
# where the provider's name belongs, so files outside these globs are skipped.
# Set it to `[]` to turn the rule off for a project with no domain layer.
[rules.rust-no-provider-in-domain]
providers = [
    "twilio",
    "stripe",
    "gladia",
    "ferriskey",
    "openai",
    "anthropic",
    "brevo",
    "scaleway",
]
domain_globs = ["**/domain/**"]

# ---------------------------------------------------------------
# Cross-language thresholds — these propagate into the generated
# oxlintrc + clippy flags, so the same authoritative number flows
# into every linter comply orchestrates.
# ---------------------------------------------------------------

[rules.max-params]
max = 4

[rules.max-depth]
max = 3

[rules.nested-control-flow]
max = 3

[rules.no-abbreviated-names]
allowed = []
banned = []

[rules.id-length]
min = 2
# Uncomment to allowlist identifiers that are conventional at <2 chars:
#   `t` for react-i18next's useTranslation()
#   `T` for typescript generics
exceptions = ["_", "t", "T"]
exception_patterns = ["^[A-Z]$"]

# ---------------------------------------------------------------
# Complexity / quality thresholds.
# ---------------------------------------------------------------

[rules.cyclomatic-complexity]
max = 15

[rules.cognitive-complexity]
max = 30

[rules.halstead-complexity]
max_volume = 1500
max_difficulty = 30
max_effort = 1000000

[rules.expression-complexity]
max_ops = 4

[rules.regex-complexity]
max = 20

[rules.max-call-chain-depth]
max = 4

[rules.intermediate-variables]
min_ops = 2

[rules.playwright-max-nested-describe]
max = 5

[rules.playwright-max-expects]
max = 5

# Maximum number of class selectors allowed in a single CSS selector.
[rules.no-excessive-selector-classes]
max = 3

[rules.template-indent]
min_indent = 4

[rules.comment-paraphrases-code]
max_comment_tokens = 6
overlap_threshold = 0.80

# Maximum total words in one comment block. Consecutive `//` lines merge into a
# single block; each `/* */` stands alone. Doc comments (`///`, `//!`, `/**`,
# `/*!`) and license banners are exempt — the budget targets implementation-note
# bloat, not API prose.
[rules.comment-max-block-words]
max = 50

# When non-empty, jsdoc-missing-example only fires on files whose path matches
# at least one of these glob patterns. Leave empty (the default) to require
# @example on every exported function with JSDoc regardless of file location.
# Example: public_patterns = ["src/public/**", "packages/*/src/index.ts"]
[rules.jsdoc-missing-example]
public_patterns = []

# no-nullish-default-on-input flags `??`/`||` defaulting of a function parameter,
# whose remedy ("validate and return a Result error") only applies at a backend
# request boundary. Syntactic detection can't tell a request input from a React
# prop or a helper arg, so the rule is scoped by path: it fires only on files
# whose path matches at least one of these globs (default: the backend API tree).
# Set to `[]` to fire everywhere, or point it at your own handler directories.
[rules.no-nullish-default-on-input]
paths = ["src/api/**", "**/src/api/**"]

# ts-no-generated-type-alias matches an import specifier against these globs to
# decide whether the type it binds is owned by a code generator. Only the project
# knows where its codegen writes, so add your own output here — a re-export
# barrel counts (e.g. "#/api/api"). Set to `[]` to turn the rule off.
[rules.ts-no-generated-type-alias]
generated_modules = [
  "**/generated",
  "**/generated/**",
  "**/__generated__",
  "**/__generated__/**",
]

[rules.sql-index-needs-rationale-comment]
min_rationale_words = 3
lookback_lines = 3

[rules.no-duplicate-string]
min_length = 10
min_occurrences = 3

# ---------------------------------------------------------------
# Drizzle ORM thresholds.
# ---------------------------------------------------------------

[rules.drizzle-chunk-large-batch-insert]
max = 500

# Maximum number of statements allowed between a Drizzle read-probe and the
# write it guards (or a write and its re-read) for the redundant-roundtrip
# pattern to be reported. A wider gap means the two operations are unlikely to
# be a single check-then-act / write-then-reread sequence.
[rules.drizzle-no-redundant-roundtrip-around-write]
max_statement_gap = 2

# ---------------------------------------------------------------
# Cross-file centralisation heuristics.
# ---------------------------------------------------------------

# Fraction of the indexed file set that may import a single module
# before it's flagged as over-central. Defaults to 30%. `min_importers`
# gates the rule to avoid firing on tiny projects where every file is
# mathematically a god module.
[rules.god-module]
threshold_percent = 30
min_importers = 10

# A `common` / `utils` / `helpers` / `shared` / `misc` / `util` module is
# reported once it exports at least this many symbols. Under the bar the
# generic name costs a reader little.
[rules.no-common-grab-bag]
min_exports = 25

# Near-duplicate comment detection. Flags prose comments that share a verbatim
# opening — the signature of a copy-pasted explanation that drifts out of sync.
# `min_words` keeps short comments (TODOs, directives) out of scope; a comment
# is reported only when it shares at least `shared_prefix_words` opening words
# with another AND that shared run covers at least `prefix_pct` of the shorter
# comment.
[rules.no-duplicate-comments]
min_words = 15
shared_prefix_words = 8
prefix_pct = 0.25

# Cross-file exact-duplicate named functions. Flags a named function whose
# identifier AND body (tokens, comments/whitespace ignored) are identical across
# two or more files — the copy-paste that clone detection misses when the body
# is shorter than its 100-token window. `min_body_tokens` keeps trivial bodies
# (`noop`, one-line getters) out of scope.
[rules.no-duplicate-function]
min_body_tokens = 10

# Cross-program structurally-identical named object types (a copy-paste smell).
# `min_properties` is the minimum number of resolved properties a shape must have
# before two identical shapes are called a consolidation target. Small shapes
# (3 fields or fewer) collide coincidentally between unrelated domains and would
# diverge as they evolve, so the floor is set above them.
[rules.no-duplicate-type-definition]
min_properties = 4

# ---------------------------------------------------------------
# Disabled by default — opt-in only.
# ---------------------------------------------------------------

[rules.node-no-callback-literal]
disabled = true

[rules.ts-explicit-function-return-type]
disabled = true

[rules.explicit-function-return-type]
disabled = true

[rules.ts-explicit-module-boundary-types]
disabled = true

[rules.explicit-module-boundary-types]
disabled = true

[rules.no-extraneous-class]
disabled = true

[rules.no-throw]
disabled = true

# ---------------------------------------------------------------
# Rust correctness / observability — no thresholds, listed here
# so `comply config print` surfaces them and users can flip
# `disabled = true` to opt out per-project.
# ---------------------------------------------------------------

[rules.rust-no-todo-macro]

[rules.rust-no-sleep-in-test]

[rules.rust-prefer-tracing-over-log]

# ---------------------------------------------------------------
# Docker Compose — no thresholds, same rationale as above.
# ---------------------------------------------------------------

[rules.compose-no-network-host]

[rules.compose-healthcheck-required]

# ---------------------------------------------------------------
# Next.js — no thresholds, same rationale.
# ---------------------------------------------------------------

[rules.next-no-redirect-in-try-catch]

# ---------------------------------------------------------------
# Node.js — no thresholds, same rationale.
# ---------------------------------------------------------------

[rules.node-no-unhandled-rejection]

[rules.node-prefer-stream-pipeline]

# ---------------------------------------------------------------
# Barrel / import hygiene.
# ---------------------------------------------------------------

# Set `allow_import_then_reexport = true` to silence prefer-export-from
# when your project convention bans `export { x } from "path"` syntax.
[rules.prefer-export-from]
allow_import_then_reexport = false

[rules.avoid-barrel-files]
min_reexports = 3

# ---------------------------------------------------------------
# Function / component size.
# ---------------------------------------------------------------

[rules.react-no-giant-component]
max = 300

[rules.no-identical-functions]
min_body_lines = 4
min_normalized_chars = 51

[rules.no-small-switch]
min_cases = 3

# Minimum length of a homogeneously-numeric array literal before its elements
# are treated as embedded data (byte arrays, lookup tables, serialized binary
# such as ONNX protobuf) rather than magic numbers. Naming individual bytes of
# such data is meaningless, so the elements are not flagged.
[rules.no-magic-numbers]
min_data_array_len = 10

# Minimum numeric-leaf count of a homogeneously-numeric array literal (flat array
# or matrix) before its `N.0` elements are treated as embedded float data
# (coordinate matrices, coefficient tables) rather than redundant zero fractions.
# Normalizing an individual leaf of such a table is meaningless, so the elements
# are not flagged.
[rules.no-zero-fractions]
min_data_array_len = 10

# Minimum numeric-leaf count of a homogeneously-numeric array literal (flat array
# or matrix) before its elements are treated as embedded data (cryptographic
# K-tables such as the MD5/SHA constant tables, byte arrays, coefficient tables)
# rather than groupable quantities. Inserting digit-grouping separators into an
# individual leaf is meaningless and obscures spec-verbatim constants, so the
# elements are not flagged.
[rules.numeric-separators-style]
min_data_array_len = 10

# Minimum element count before a const array `.includes()` is worth a `Set`.
# Below this, a linear scan beats constructing a `Set` + hashing + the extra
# allocation, so suggesting `Set#has()` is a net pessimization.
[rules.prefer-set-has]
min_array_len = 4

# ---------------------------------------------------------------
# UI / CSS thresholds.
# ---------------------------------------------------------------

[rules.ui-no-z-index-9999]
max = 100

[rules.ui-no-inline-exhaustive-style]
max_properties = 8

[rules.ui-no-large-animated-blur]
max_blur_px = 20.0

[rules.ui-no-long-transition-duration]
max_duration_ms = 1000.0
max_duration_s = 1.0

[rules.ui-no-tiny-text]
min_font_size_px = 12.0

[rules.ui-no-wide-letter-spacing]
max_letter_spacing_em = 0.05

# Opt-in Tailwind blocklist. Empty by default — the rule is a no-op until a
# project lists the utility classes it wants to ban. Populate `classes` to
# enforce a design-system convention, e.g. an OKLCH-only palette that forbids
# raw black/white or legacy `space-*` directional spacing:
#   classes = ["bg-white", "bg-black", "text-white", "text-black", "space-y-px", "space-x-px"]
[rules.tailwind-no-restricted-classes]
classes = []

# Opt-in required-scripts check for package.json. Empty by default — the rule
# is a no-op until a project lists the npm scripts it expects every package to
# define, e.g.:
#   scripts = ["build", "test", "lint"]
[rules.package-json-required-scripts]
scripts = []

# Required order of Vue `<script setup>` compiler macros. A macro found out of
# this order (or after non-skippable non-macro content) is flagged. Names not
# listed are treated as non-macro statements.
[rules.use-vue-define-macros-order]
order = ["defineModel", "defineProps", "defineEmits"]

# ---------------------------------------------------------------
# React thresholds.
# ---------------------------------------------------------------

[rules.react-prefer-use-reducer]
max_state_calls = 4

[rules.react-require-content-visibility]
min_nodes = 20

# ---------------------------------------------------------------
# Framework-specific thresholds.
# ---------------------------------------------------------------

[rules.prisma-no-nested-include-depth]
max_depth = 3

[rules.ts-no-large-string-union]
max = 50

[rules.better-result-prefer-matcherror-exhaustive]
min_tags = 3

[rules.perf-img-fetchpriority-high]
hero_pixel_threshold = 600

[rules.tanstack-start-loader-stale-time]
min_stale_time_ms = 5000

[rules.tanstack-start-session-secret-min-length]
min_length = 32

[rules.react-no-request-state-mirror]
# String literals treated as request-phase names on top of the built-in set
# (idle, loading, pending, error, success, fetching, submitting, saving).
# Matched case-insensitively. Add the words your codebase mirrors with.
extra_literals = []
# Set to false to keep only the union half of the rule, so `useState("idle")`
# stops being flagged.
check_use_state = true

# ---------------------------------------------------------------
# i18n / Kubernetes thresholds.
# ---------------------------------------------------------------

[rules.i18n-max-key-depth]
max_depth = 3

[rules.k8s-hpa-min-three-replicas]
min_replicas = 3

# ---------------------------------------------------------------
# Security — no thresholds, same rationale.
# ---------------------------------------------------------------

[rules.security-cookie-no-samesite-none]

[rules.security-no-cors-reflect-origin]

[rules.security-no-password-in-log]

[rules.use-unique-element-ids]
# Component names whose static `id` is intentional (e.g. an i18n message id, not
# a DOM id). Matched against the element's unqualified name.
excluded_components = []

# ---------------------------------------------------------------
# React Native platform components.
#
# A file is treated as platform-specific when its path matches one
# of these globs. An `*Android`/`*IOS` component imported from
# `react-native` is only allowed in a file of the matching platform.
# ---------------------------------------------------------------

[rules.use-react-native-platform-components]
android_path_patterns = ["**/*.android.{js,jsx,ts,tsx}"]
ios_path_patterns = ["**/*.ios.{js,jsx,ts,tsx}"]

# ---------------------------------------------------------------
# use-qwik-loader-location
# Qwik route loaders/actions only run when declared in a route
# boundary file. A "route boundary" is an `index`/`layout`/`plugin`
# file under `src/routes`; these globs define which files qualify.
# ---------------------------------------------------------------

# Each glob's last segment uses a `index*`/`layout*`/`plugin*` prefix to mirror
# Biome's filename `starts_with` check (e.g. `index.tsx`, `layout@auth.tsx`).
[rules.use-qwik-loader-location]
route_boundary_patterns = [
  "**/src/routes/**/index*",
  "**/src/routes/**/layout*",
  "**/src/routes/**/plugin*",
  "src/routes/**/index*",
  "src/routes/**/layout*",
  "src/routes/**/plugin*",
]

# ---------------------------------------------------------------
# no-unknown-pseudo-class
# Unknown pseudo-class names to allow (case-insensitive), e.g.
# framework-specific custom pseudo-classes. Empty by default.
# Example: ignore = ["custom-pseudo-class"]
# ---------------------------------------------------------------
[rules.no-unknown-pseudo-class]
ignore = []

# ---------------------------------------------------------------
# no-unknown-pseudo-element
# Unknown pseudo-element names to allow (case-insensitive), e.g.
# framework-specific custom pseudo-elements. Empty by default.
# Example: ignore = ["custom-pseudo-element"]
# ---------------------------------------------------------------
[rules.no-unknown-pseudo-element]
ignore = []

# ---------------------------------------------------------------
# filename-naming-convention
# JS/TS source uses kebab-case by default, but Angular/Google mandate
# snake_case for all TypeScript source. A snake_case file is accepted only when
# snake_case is the project's *established* dominant convention: its share of
# all classifiable TS/JS stems must reach `min_dominant_share`. A kebab-dominant
# project with a few stray snake_case files stays below the threshold, so those
# files are still flagged.
# ---------------------------------------------------------------
[rules.filename-naming-convention]
min_dominant_share = 0.6

[rules.no-approximative-numeric-constant]
# A numeric literal that coincidentally matches a Math constant prefix is data,
# not a symbolic constant, when it sits among many siblings in a numeric array
# literal (precomputed tables, matrices). Suppress the diagnostic once the
# enclosing array literal holds at least this many numeric elements. (Typed-array
# initializers like `new Float32Array([...])` are always treated as data,
# regardless of element count.)
min_array_elements = 8
