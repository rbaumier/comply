# React Router 7 in framework mode (`@react-router/dev`). The files it loads
# sit under the app directory that `react-router.config.*` may move, and its
# route modules are named by `routes.ts`, so `react_router.rs` derives them in
# code. The lists below follow the React Router 7 docs on route modules,
# `root.tsx`, `routes.ts` and `entry.server.tsx`.
[detection]
dependencies = ["@react-router/dev"]
files = [
    "react-router.config.ts", "react-router.config.js",
    "react-router.config.mts", "react-router.config.mjs",
]

[route_magic_exports]
route_files = [
    "default", "middleware", "clientMiddleware", "loader", "clientLoader",
    "action", "clientAction", "ErrorBoundary", "HydrateFallback", "headers",
    "handle", "links", "meta", "shouldRevalidate",
]
root_route = ["Layout"]
route_config = ["default"]
server_entry = ["default", "streamTimeout", "handleDataRequest", "handleError"]
